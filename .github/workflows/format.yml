name: Check Formatting

on:
  pull_request:
    branches:
      - main

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: yarn --frozen-lockfile

      - name: Check formatting with Prettier
        run: npx prettier --check .
