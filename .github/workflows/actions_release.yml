name: Release GitHub Actions

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release"
        required: true
      node_version:
        description: "Node.js version to use"
        required: false
        default: "24"
      backport:
        description: "Backport/patch release from a maintenance branch (keeps current latest, skips v-major tag move)"
        required: false
        type: boolean
        default: false
        
permissions:
  contents: read

jobs:
  release:
    permissions:
      actions: read
      id-token: write
      contents: write

    uses: step-security/reusable-workflows/.github/workflows/actions_release.yaml@fix/older_version_release
    with:
      tag: "${{ github.event.inputs.tag }}"
      node_version: ${{ inputs.node_version || '24' }}
      backport: ${{ inputs.backport || false }}
